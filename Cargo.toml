[package]
name = "ditto-policy"
version = "0.1.0"
edition = "2024"
description = "Write policy plugin for strfry and Ditto Relay"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20 = "0.9"
clap = { version = "4", features = ["derive", "env"] }
heed = { version = "0.22", default-features = false }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
# The crypto provider tungstenite's TLS uses; with only this one compiled in,
# rustls picks it without being told.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
